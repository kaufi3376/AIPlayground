<style>

<div class="app-center">
    <div class="container-flex">
    <div class="card shadow p-4 w-full">
        <h2 class="text-center">Datensatz wählen</h2>

        <div class="mb-3">
            <label class="form-label">Datensatz-Auswahl:</label>
            <div class="form-check form-switch d-inline-block ms-2">
                <input class="form-check-input" type="checkbox" id="datasetSwitch">
                <label class="form-check-label" for="datasetSwitch">Eigenen Datensatz hochladen</label>
            </div>
        </div>

        <input type="file" class="form-control" id="csvFile" accept=".csv" style="display:none;">
        <br>

                <div id="columnSelectors" style="display:none; margin-bottom:12px;">
                    <div class="row mb-2">
                        <div class="col-auto">
                            <label class="form-label">X-Spalte:</label>
                            <select id="xSelect" class="form-select" style="max-width:320px; display:inline-block; margin-right:8px;">
                                <option value="">-- bitte wählen --</option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <label class="form-label">Y-Spalte:</label>
                            <select id="ySelect" class="form-select" style="max-width:320px; display:inline-block; margin-right:8px;">
                                <option value="">-- bitte wählen --</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-auto">
                            <label class="form-label">Klassen-Spalte:</label>
                            <select id="classSelect" class="form-select" style="max-width:320px; display:inline-block;">
                                <option value="">-- bitte wählen --</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-auto">
                            <label class="form-label">Bezeichnungs-Spalte:</label>
                            <select id="labelSelect" class="form-select" style="max-width:320px; display:inline-block;">
                                <option value="">-- bitte wählen --</option>
                            </select>
                        </div>
                    </div>
                </div>

                                <div id="chartCard" style="display:none;">
                                                    <div class="card shadow p-4 mt-4" style="flex:0 0 900px;">
                                                        <!-- k-Wert slider ist in der rechten Auswertungs-Karte platziert -->
                                                        <canvas id="chart" width="900" height="560" style="display:block;"></canvas>
                                                    </div>
                                                </div>
                    </div>
                    <div class="card shadow p-4" style="flex:0 0 400px;">
                        <h3 class="text-center">Auswertung</h3>
                        <div class="mb-3 d-flex align-items-center justify-content-center">
                            <label for="kValue" class="form-label me-2">k-Wert:</label>
                            <input type="range" id="kValue" min="1" max="15" value="3" class="form-range" style="max-width:200px;">
                            <span id="kDisplay" class="ms-2">3</span>
                        </div>
                        <div id="neighborPanel">
                            <em>Kein Punkt ausgewählt.</em>
                        </div>
                    </div>
                </div>

<script>
let rawRows = []; // parsed rows as objects
let headers = [];
const ctx = document.getElementById("chart").getContext("2d");
let chart = new Chart(ctx, {
    type: "scatter",
    data: { datasets: [{ label: 'Daten', data: [], backgroundColor: [], pointRadius: [], borderColor: [], pointBorderWidth: 2 }] },
    options: {
        responsive: false,
        scales: {
            x: { type: 'linear', title: { display: true, text: '' } },
            y: { type: 'linear', title: { display: true, text: '' } }
        },
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(ctx){
                        const p = ctx.raw;
                        const labelKey = document.getElementById('labelSelect')?.value;
                        let labelText = '';
                        if(labelKey && p.raw && p.raw[labelKey]){
                            labelText = `Bezeichnung: ${p.raw[labelKey]}`;
                        }
                        return `${labelText}${labelText ? ', ' : ''}x: ${p.x}, y: ${p.y}`;
                    }
                }
            }
        }
    }
});

// Beispiel-Datensatz laden
function loadExampleDataset() {
    fetch('../Datasets/Schulmanschaften.csv')
        .then(response => response.text())
        .then(text => {
            handleCSV(text);
        });
}

// CSV-Handling ausgelagert
function handleCSV(text) {
    text = text.trim();
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length < 2) return alert('CSV enthält keine Daten.');

    // parse header
    headers = lines[0].split(/[,;\t]+/).map(h=>h.trim());
    rawRows = lines.slice(1).map(line => {
        const parts = line.split(/[,;\t]+/);
        const obj = {};
        headers.forEach((h,i)=> obj[h] = parts[i]!==undefined ? parts[i].trim() : '');
        return obj;
    });

    // populate selects (only headers with numeric values)
    const xSelect = document.getElementById('xSelect');
    const ySelect = document.getElementById('ySelect');
    const classSelect = document.getElementById('classSelect');
    const labelSelect = document.getElementById('labelSelect');
    xSelect.innerHTML = '<option value="">-- bitte wählen --</option>';
    ySelect.innerHTML = '<option value="">-- bitte wählen --</option>';
    classSelect.innerHTML = '<option value="">-- bitte wählen --</option>';
    labelSelect.innerHTML = '<option value="">-- bitte wählen --</option>';

    // find headers that contain at least one numeric value
    const numericHeaders = headers.filter(h => {
        return rawRows.some(r => { const v = toNumber(r[h]); return !isNaN(v); });
    });

    // find headers that are likely categorical (mindestens ein Wert ist nicht numerisch)
    const classHeaders = headers.filter(h => {
        return rawRows.some(r => isNaN(toNumber(r[h])) && r[h] !== '');
    });

    if(numericHeaders.length === 0){
        alert('Keine numerischen Spalten in der CSV gefunden.');
        return;
    }

    numericHeaders.forEach(h=>{ xSelect.appendChild(new Option(h,h)); ySelect.appendChild(new Option(h,h)); });
    classHeaders.forEach(h=>{ classSelect.appendChild(new Option(h,h)); });
    headers.forEach(h=>{ labelSelect.appendChild(new Option(h,h)); });

    // Wenn Beispieldatensatz aktiv ist, wähle feste Spalten und blende Dropdowns aus
    if (!document.getElementById('datasetSwitch').checked) {
        xSelect.value = 'Geschwindigkeit';
        ySelect.value = 'Ballkontrolle';
        classSelect.value = 'Lieblingssport';
        labelSelect.value = 'Name';
        document.getElementById('columnSelectors').style.display = 'none';
        updatePlot();
    } else {
        document.getElementById('columnSelectors').style.display = 'block';
    }
}

// Switch-Logik
document.getElementById('datasetSwitch').addEventListener('change', function(){
    if(this.checked){
        document.getElementById('csvFile').style.display = '';
        document.getElementById('columnSelectors').style.display = 'none';
    }else{
        document.getElementById('csvFile').value = '';
        document.getElementById('csvFile').style.display = 'none';
        loadExampleDataset();
    }
});

// CSV laden and populate column selectors
document.getElementById("csvFile").addEventListener("change", function(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        handleCSV(e.target.result);
    };
    reader.readAsText(file);
});

// Initial: Beispieldatensatz laden und Switch auf "aus" setzen
document.getElementById('datasetSwitch').checked = false;
document.getElementById('csvFile').style.display = 'none';
loadExampleDataset();

// (duplicate CSV listener removed — handled via handleCSV and dataset switch)

document.getElementById('xSelect').addEventListener('change', updatePlot);
document.getElementById('ySelect').addEventListener('change', updatePlot);
document.getElementById('classSelect').addEventListener('change', updatePlot);
document.getElementById('labelSelect').addEventListener('change', updatePlot);
document.getElementById('classSelect').addEventListener('change', function(){ renderNeighborInfo(); });

// k-Value slider behavior: update display and recompute neighbors when k changes
document.getElementById('kValue').addEventListener('input', function(){
    document.getElementById('kDisplay').textContent = this.value;
    // if a click exists, recompute neighbors with the new k
    recomputeNeighbors();
});

// k-NN click handler on chart — show a new selection point and highlight neighbors without changing original colors
let lastSelection = { clicked: null, neighbors: [] };
chart.canvas.addEventListener('click', function(evt){
    // get chart coordinates (use chart area translation)
    const rect = chart.canvas.getBoundingClientRect();
    const offsetX = evt.clientX - rect.left;
    const offsetY = evt.clientY - rect.top;
    const xVal = chart.scales.x.getValueForPixel(offsetX);
    const yVal = chart.scales.y.getValueForPixel(offsetY);

    // build pts array from current base dataset
    const pts = chart.data.datasets[0].data;
    if(!pts || pts.length === 0) return;

    // compute distances from the clicked location
    const distances = pts.map((p,i)=>({ idx:i, dist: Math.hypot(p.x - xVal, p.y - yVal), raw: p.raw }));
    const k = Math.max(1, parseInt(document.getElementById('kValue').value || '3'));
    distances.sort((a,b)=>a.dist - b.dist);
    const neighbors = distances.slice(0,k);

    // Prepare neighbor dataset (overlay), selection (click coordinate) and nearest-point dataset
    const baseDataset = chart.data.datasets[0];
    const defaultRadius = 6;

    const neighborPoints = neighbors.map(n => ({ x: pts[n.idx].x, y: pts[n.idx].y, raw: pts[n.idx].raw }));
    // determine neighbor colors based on base dataset colors (if array), otherwise fallback
    const neighborBg = neighbors.map(n => Array.isArray(baseDataset.backgroundColor) ? baseDataset.backgroundColor[n.idx] : (baseDataset.backgroundColor || '#2563eb'));

    const neighborDataset = {
        label: 'Nachbarn',
        data: neighborPoints,
        backgroundColor: neighborBg,
        pointRadius: neighborPoints.map(()=> defaultRadius + 3),
        borderColor: neighborBg.map(()=> '#000'),
        pointBorderWidth: 2,
        showLine: false
    };

    // show the actual nearest existing point as selection (not the raw click coordinate)
    const clickedPoint = pts[neighbors[0].idx];
    // clicked coordinate (new temporary point)
    const clickedCoord = { x: xVal, y: yVal, raw: {} };
    const selectionDataset = {
        label: 'Klick-Koordinate',
        data: [clickedCoord],
        backgroundColor: '#ff0000',
        borderColor: '#ff0000',
        pointRadius: 8,
        pointStyle: 'cross',
        pointBorderWidth: 3,
        showLine: false
    };

    // nearest existing data point
    const nearestPoint = pts[neighbors[0].idx];
    const nearestDataset = {
        label: 'Nächster Punkt',
        data: [{ x: nearestPoint.x, y: nearestPoint.y, raw: nearestPoint.raw }],
        backgroundColor: '#ffffff',
        borderColor: '#000000',
        pointRadius: 9,
        pointBorderWidth: 2,
        pointStyle: 'circle',
        showLine: false
    };

    // Replace any existing overlay datasets (keep base dataset at index 0)
    chart.data.datasets.splice(1, chart.data.datasets.length - 1, neighborDataset, nearestDataset, selectionDataset);
    chart.update();

    lastSelection.clicked = nearestPoint;
    lastSelection.neighbors = neighbors;
    lastSelection.clickedCoord = { x: xVal, y: yVal };
    renderNeighborInfo();
});

// Recompute neighbors if k changes (uses lastSelection.clickedCoord)
function recomputeNeighbors(){
    if(!lastSelection.clickedCoord) return;
    const xVal = lastSelection.clickedCoord.x;
    const yVal = lastSelection.clickedCoord.y;
    const pts = chart.data.datasets[0].data;
    if(!pts || pts.length===0) return;
    const distances = pts.map((p,i)=>({ idx:i, dist: Math.hypot(p.x - xVal, p.y - yVal), raw: p.raw }));
    const k = Math.max(1, parseInt(document.getElementById('kValue').value || '3'));
    distances.sort((a,b)=>a.dist - b.dist);
    const neighbors = distances.slice(0,k);

    const baseDataset = chart.data.datasets[0];
    const neighborPoints = neighbors.map(n => ({ x: pts[n.idx].x, y: pts[n.idx].y, raw: pts[n.idx].raw }));
    const neighborBg = neighbors.map(n => Array.isArray(baseDataset.backgroundColor) ? baseDataset.backgroundColor[n.idx] : (baseDataset.backgroundColor || '#2563eb'));

    const neighborDataset = {
        label: 'Nachbarn',
        data: neighborPoints,
        backgroundColor: neighborBg,
        pointRadius: neighborPoints.map(()=> 9),
        borderColor: neighborBg.map(()=> '#000'),
        pointBorderWidth: 2,
        showLine: false
    };

    const clickedCoord = { x: xVal, y: yVal, raw: {} };
    const selectionDataset = {
        label: 'Klick-Koordinate',
        data: [clickedCoord],
        backgroundColor: '#ff0000',
        borderColor: '#ff0000',
        pointRadius: 7,
        pointStyle: 'cross',
        pointBorderWidth: 3,
        showLine: false
    };

    const nearestPoint = pts[neighbors[0].idx];
    const nearestDataset = {
        label: 'Nächster Punkt',
        data: [{ x: nearestPoint.x, y: nearestPoint.y, raw: nearestPoint.raw }],
        backgroundColor: '#ffffff',
        borderColor: '#000000',
        pointRadius: 9,
        pointBorderWidth: 2,
        pointStyle: 'circle',
        showLine: false
    };

    chart.data.datasets.splice(1, chart.data.datasets.length - 1, neighborDataset, nearestDataset, selectionDataset);
    chart.update();

    lastSelection.clicked = nearestPoint;
    lastSelection.neighbors = neighbors;
    renderNeighborInfo();
}

function renderNeighborInfo(){
    const info = document.getElementById('neighborPanel');
    if(!lastSelection.clicked){ info.innerHTML = '<em>Kein Punkt ausgewählt.</em>'; return; }
    let html = '';
    const classKey = document.getElementById('classSelect')?.value;

    if(!classKey){
        // no class column chosen -> show simple neighbors list
        html += `<strong>Keine Klassen-Spalte gewählt.</strong><br>`;
    } else {
        // compute vote counts among neighbors
        const counts = {};
        lastSelection.neighbors.forEach(n=>{
            const p = chart.data.datasets[0].data[n.idx];
            const cls = p && p.raw ? p.raw[classKey] : undefined;
            const key = (cls === undefined || cls === '') ? '(leer)' : String(cls);
            counts[key] = (counts[key] || 0) + 1;
        });
        const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
        const predicted = entries.length ? entries[0][0] : '(keine)';
        const distStr = entries.map(e=>`${e[0]}: ${e[1]}`).join(', ').replace(/"/g,'&quot;');
        html += `<div><strong>Mehrheitsauswahl:</strong> <span title="${distStr}" style="cursor:help; text-decoration:underline dotted">${predicted}</span></div>`;
    }

    // neighbors list: name and class only
    html += `<hr><strong>Nachbarn:</strong><ul>`;
    lastSelection.neighbors.forEach(n=>{
        const p = chart.data.datasets[0].data[n.idx];
        const name = formatPoint(p);
        const cls = classKey && p.raw ? p.raw[classKey] : '';
        html += `<li>${name}${cls ? ' — ' + cls : ''}</li>`;
    });
    html += '</ul>';
    info.innerHTML = html;
}

function formatPoint(p){
    const labelKey = document.getElementById('labelSelect')?.value;
    if(labelKey && p.raw && p.raw[labelKey]){
        return `${p.raw[labelKey]}`;
    }
    return '(kein Bezeichner)';
}

// utility: darken/lighten hex color
function shadeColor(color, percent) {
    // color like #rrggbb
    try{
        const f=parseInt(color.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent;
        const R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
        const newR = Math.round((t-R)*p/100)+R;
        const newG = Math.round((t-G)*p/100)+G;
        const newB = Math.round((t-B)*p/100)+B;
        return `#${(0x1000000 + (newR<<16) + (newG<<8) + newB).toString(16).slice(1)}`;
    }catch(e){return color;}
}

function toNumber(val){ if(val===null||val===undefined) return NaN; return parseFloat(String(val).replace(',','.')); }

function updatePlot(){
    const xKey = document.getElementById('xSelect').value;
    const yKey = document.getElementById('ySelect').value;
    const classKey = document.getElementById('classSelect').value;
    const chartCard = document.getElementById('chartCard');
    if(!xKey || !yKey) { chartCard.style.display = 'none'; return; }

    const pts = rawRows.map(r=>({ x: toNumber(r[xKey]), y: toNumber(r[yKey]), raw: r })).filter(p=> !isNaN(p.x) && !isNaN(p.y));
    if(pts.length === 0){ alert('Keine numerischen Werte in den gewählten Spalten gefunden.'); chartCard.style.display = 'none'; return; }

    // Farben nach Klasse
    let colors = [
        '#2563eb', '#eab308', '#22c55e', '#ef4444', '#a21caf', '#0ea5e9', '#f59e42', '#14b8a6', '#f43f5e', '#64748b', '#d97706', '#7c3aed', '#84cc16', '#e11d48', '#f472b6'
    ];
    let pointColors = [];
    let classLabels = [];
    chart.data.datasets[0].data = pts;
    const defaultRadius = 6;
    if(classKey){
        // Alle Klassen ermitteln aus den sichtbaren Punkten
        classLabels = Array.from(new Set(pts.map(p=>p.raw[classKey]).filter(v=>v!=='')));
        // Map Klasse zu Farbe
        const classColorMap = {};
        classLabels.forEach((c,i)=>{ classColorMap[c]=colors[i%colors.length]; });
        const bg = pts.map(p => classColorMap[p.raw[classKey]] || '#888');
        chart.data.datasets[0].backgroundColor = bg;
        chart.data.datasets[0].pointRadius = pts.map(()=>defaultRadius);
    } else {
        chart.data.datasets[0].backgroundColor = pts.map(()=>colors[0]);
        chart.data.datasets[0].pointRadius = pts.map(()=>defaultRadius);
    }
    chart.options.scales.x.title.text = xKey;
    chart.options.scales.y.title.text = yKey;
    chart.options.plugins.title = { display: true, text: classKey ? `Eingefärbt nach Klasse: ${classKey}` : '' };
    chart.update();
    chartCard.style.display = 'block';
}

document.getElementById('kValue').addEventListener('input', function(){
    document.getElementById('kDisplay').textContent = this.value;
    updatePlot();
});
</script>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV-Plot mit MAE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; min-height:100vh; }
        header, footer { background-color:#0d6efd; color:white; padding:20px; text-align:center; font-size:1.5rem; font-weight:bold; }
        .app-center { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
        .container { display: flex; gap: 20px; margin-top: 10px; max-width:1100px; width:100%; }
        .card { flex: 1; padding: 20px; border-radius: 10px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); background:white; }
        .highlight-price { font-size: 2rem; font-weight: bold; color: #007bff; }
        /* navbar button styles */
        .nav-node { color: #fff !important; margin-left:8px; padding:6px 12px; border-radius:8px; font-weight:600; }
        .nav-node.knn { background-color:#28a745; }
        .nav-node.knn:hover { background-color:#218838; color:#fff !important; }
        .nav-node.lr { background-color:#6f42c1; }
        .nav-node.lr:hover { background-color:#5936a8; color:#fff !important; }
        .nav-node.kmeans { background-color:#fd7e14; }
        .nav-node.kmeans:hover { background-color:#e06600; color:#fff !important; }
        .nav-node.rl { background-color:#20c997; }
        .nav-node.rl:hover { background-color:#198754; color:#fff !important; }
        .nav-node.static { background-color:transparent; border-radius:0; padding:0; margin-right:12px; }
        .nav-node.active { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-custom { background-color: #0d6efd; }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid" style="padding-left:18px;padding-right:18px;">
            <a class="navbar-brand text-white fw-bold" href="../index.html">AI-Playground</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item"><a class="nav-link nav-node static" href="#">Maschinelles Lernen</a></li>
                    <li class="nav-item"><a class="nav-link nav-node knn" href="classification.html">KNN</a></li>
                    <li class="nav-item"><a class="nav-link nav-node lr" href="linearregression.html">Lineare Regression</a></li>
                    <li class="nav-item"><a class="nav-link nav-node kmeans" href="kmeans.html">K-Means</a></li>
                    <li class="nav-item"><a class="nav-link nav-node rl" href="drnim.html">DR.NIM</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div class="app-center">

    <div class="container">
        <div class="card shadow p-4">
            <h2 class="text-center">KI trainieren</h2>
            <input type="file" class="form-control" id="csvFile" accept=".csv">
            <br>
            <label class="form-label">Steigung:</label>
            <div class="d-flex justify-content-between">
                <input type="range" class="form-range" id="slope" min="-1" max="1" step="0.01" value="0">
                <span id="slopeValue">0</span>
            </div>
            <label class="form-label">Y-Achsenabschnitt:</label>
            <div class="d-flex justify-content-between">
                <input type="range" class="form-range" id="intercept" min="0" max="50000" step="100" value="25000">
                <span id="interceptValue">25000</span>
            </div>
            <p class="text-muted">Fehlerabweichung (MAE): <span id="mseValue">0</span></p>
            <canvas id="chart" width="600" height="400"></canvas>
        </div>
        <div class="card shadow p-4">
            <h2 class="text-center">Preisvorhersage</h2>
            <label class="form-label">Fahrzeug Kilometerstand eingeben:</label>
            <input type="number" class="form-control mb-3" id="kmInput" placeholder="Kilometerstand">
            <button class="btn btn-primary w-100" onclick="predictPrice()">Preis berechnen</button>
            <p class="text-center mt-3">Vorhergesagter Preis:</p>
            <p class="text-center highlight-price" id="predictedPrice">-</p>
            <p class="text-center" id="priceInterval">Intervall: [-, -]</p> <!-- Preisintervall anzeigen -->
        </div>
    </div>

    <script>
        let data = [];
        const ctx = document.getElementById('chart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'scatter',
            data: { 
                datasets: [
                    { 
                        label: 'Datenpunkte', 
                        data: [], 
                        backgroundColor: 'blue', 
                        showLine: false 
                    }, 
                    { 
                        label: 'Regressionslinie', 
                        data: [], 
                        type: 'line', 
                        borderColor: 'red', 
                        borderWidth: 2, 
                        fill: false, 
                        pointRadius: 0 
                    }
                ] 
            },
            options: { 
                scales: { 
                    x: { 
                        type: 'linear', 
                        position: 'bottom', 
                        title: { display: true, text: 'Kilometerstand' } 
                    }, 
                    y: { 
                        type: 'linear', 
                        title: { display: true, text: 'Preis' } 
                    } 
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            // Hier fügen wir die zusätzlichen Infos hinzu
                            label: function(tooltipItem) {
                                const point = tooltipItem.raw;
                                const dataPoint = data.find(d => d.x === point.x && d.y === point.y);
                                return `${dataPoint.marke} - ${dataPoint.baujahr} | Preis: ${point.y} €`;
                            }
                        }
                    }
                }
            }
        });

        document.getElementById("csvFile").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                data = text.split('\n').slice(1).map(row => {
                    const [marke, km, baujahr, preis, link] = row.split(',');
                    return { 
                        x: +km, 
                        y: +preis, 
                        marke: marke, 
                        baujahr: baujahr,
                        link: link
                    };
                }).filter(d => !isNaN(d.x) && !isNaN(d.y));
                updateChart();
            };
            reader.readAsText(file);
        });
        

        function updateChart() {
            chart.data.datasets[0].data = data;
            updateLine();
            console.log(data)
        }

        function updateLine() {
            if (data.length === 0) return;
            
            const m = +document.getElementById("slope").value;
            const b = +document.getElementById("intercept").value;
            const xMin = Math.min(...data.map(d => d.x));
            const xMax = Math.max(...data.map(d => d.x));
            const yMin = m * xMin + b;
            const yMax = m * xMax + b;
            
            chart.data.datasets[1].data = [{ x: xMin, y: yMin }, { x: xMax, y: yMax }];
            calculateMAE(m, b);  // MAE statt MSE
            chart.update();
        }

        function calculateMAE(m, b) {
            let mae = 0;
            if (data.length > 0) {
                mae = data.reduce((sum, d) => sum + Math.abs((m * d.x + b) - d.y), 0) / data.length;
            }
            document.getElementById("mseValue").textContent = mae.toFixed(2);  // MAE anzeigen
        }

        function calculatePriceInterval(m, b, km) {
            const predictedPrice = m * km + b;
            const mae = data.reduce((sum, d) => sum + Math.abs((m * d.x + b) - d.y), 0) / data.length;
            const lowerBound = predictedPrice - mae;
            const upperBound = predictedPrice + mae;
            
            document.getElementById("predictedPrice").textContent = `${predictedPrice.toFixed(2)} €`;
            document.getElementById("priceInterval").textContent = `Im Bereich zwischen: ${lowerBound.toFixed(2)} €- ${upperBound.toFixed(2)} €`;
        }

        function predictPrice() {
            const km = +document.getElementById("kmInput").value;
            const m = +document.getElementById("slope").value;
            const b = +document.getElementById("intercept").value;
            if (!isNaN(km)) {
                calculatePriceInterval(m, b, km);
            }
        }

        document.getElementById("slope").addEventListener("input", function() {
            document.getElementById("slopeValue").textContent = this.value;
            updateLine();
        });

        document.getElementById("intercept").addEventListener("input", function() {
            document.getElementById("interceptValue").textContent = this.value;
            updateLine();
        });
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
    const path = window.location.pathname.split('/').pop();
    document.querySelectorAll('.nav-node').forEach(function(a){
        try{
            const href = a.getAttribute('href');
            if(href && href.split('/').pop() === path) a.classList.add('active');
        }catch(e){}
    });
});
</script>

    </div>
</div>
